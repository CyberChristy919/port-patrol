name: Request a feature
description: Suggest a new game mode, badge, port, study tool, or improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Got an idea that would help people learn their ports? Tell us about it.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should Port Patrol add or change?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would it help?
      description: For example, which exam you're studying for or what's hard to remember today.
  - type: dropdown
    id: exam
    attributes:
      label: Which exam are you studying for?
      multiple: true
      options:
        - CompTIA Network+
        - CompTIA Security+
        - Cisco CCNA
        - School networking class
        - Other
